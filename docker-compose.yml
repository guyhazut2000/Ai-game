# Dev: run infra (Postgres, Redis). Run client/gateway locally with npm run dev:client / dev:gateway.
# Optional: use docker-compose --profile app up to also run gateway (and client build) in containers.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
      POSTGRES_DB: ai_game
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d ai_game"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: services in Docker (profile=app). Run locally with npm scripts during dev.
  auth-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.auth-service
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_URL: postgresql://game:game@postgres:5432/ai_game
      JWT_SECRET: dev-secret-change-in-prod
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - app

  player-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.player-service
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      DB_URL: postgresql://game:game@postgres:5432/ai_game
      JWT_SECRET: dev-secret-change-in-prod
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - app

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: dev-secret-change-in-prod
      AUTH_SERVICE_URL: http://auth-service:3001
      PLAYER_SERVICE_URL: http://player-service:3002
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      player-service:
        condition: service_started
    profiles:
      - app

volumes:
  postgres_data:
